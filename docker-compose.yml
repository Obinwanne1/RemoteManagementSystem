version: "3.9"

# Remote Management System — Docker Compose
# Usage: docker-compose up -d
# First run: docker-compose up -d db redis && sleep 5 && docker-compose up -d

services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rmmdb
      POSTGRES_USER: rmm_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment or .env before running docker-compose}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rmm_app -d rmmdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    cpus: 1.0

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in your environment or .env before running docker-compose}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 0.5

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
    mem_limit: 256m
    cpus: 0.5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rmm_app:${DB_PASSWORD:?Set DB_PASSWORD in your environment or .env before running docker-compose}@db:5432/rmmdb
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in your environment or .env before running docker-compose}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?}@redis:6379/1
      FLASK_ENV: production
      FLASK_DEBUG: "0"
      API_HOST: 0.0.0.0
      API_PORT: "5000"
      BACKUP_DIR: /app/backups
    # Port 5000 intentionally NOT exposed externally — nginx proxies all traffic
    expose:
      - "5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "flask --app app:create_app db upgrade && python app.py"
    mem_limit: 1g
    cpus: 1.0

  celery_worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rmm_app:${DB_PASSWORD:?Set DB_PASSWORD in your environment or .env before running docker-compose}@db:5432/rmmdb
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in your environment or .env before running docker-compose}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?}@redis:6379/1
      BACKUP_DIR: /app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A tasks.celery_app worker --pool=prefork --concurrency=4 -l info
    healthcheck:
      test: ["CMD-SHELL", "celery -A tasks.celery_app inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 1g
    cpus: 1.0

  celery_beat:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rmm_app:${DB_PASSWORD:?Set DB_PASSWORD in your environment or .env before running docker-compose}@db:5432/rmmdb
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in your environment or .env before running docker-compose}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?}@redis:6379/1
      BACKUP_DIR: /app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A tasks.celery_app beat -l info
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    mem_limit: 256m
    cpus: 0.25

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      API_BASE_URL: http://api:5000
      # Dashboard session store (utils/session_store.py) needs the same
      # in-network Redis address as api/celery — .env's REDIS_URL is a
      # localhost default meant for non-Docker dev and would silently
      # fail (falling back to less-safe URL-embedded tokens) otherwise.
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in your environment or .env before running docker-compose}@redis:6379/0
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1g
    cpus: 1.0

volumes:
  postgres_data:
  redis_data:
