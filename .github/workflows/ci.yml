name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: pip install -r api/requirements.txt

      - name: Run pytest
        working-directory: api
        env:
          SECRET_KEY: "ci-secret-key-at-least-32-chars-longxxxx"
          JWT_SECRET_KEY: "ci-jwt-secret-key-at-least-32-charsxxxx"
          DATABASE_URL: "sqlite:///:memory:"
          SUPERADMIN_PASSWORD: "CITestSuperAdmin@1"
          ORG_REGISTRATION_TOKEN: "ci-org-token-unique-secret-value-here"
        run: python -m pytest tests/ -v --tb=short
