name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Backend: pytest
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rmmdb_test
          POSTGRES_USER: rmm_app
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://rmm_app:testpass@localhost:5432/rmmdb_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      SECRET_KEY: ci-test-secret-key-not-for-production
      JWT_SECRET_KEY: ci-test-jwt-secret-key-not-for-production
      FLASK_ENV: testing
      SUPERADMIN_EMAIL: superadmin@test.local
      SUPERADMIN_PASSWORD: TestSuperAdmin@1
      ORG_REGISTRATION_TOKEN: ci-test-token
      AI_ASSISTANT_ENABLED: "false"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        working-directory: api
        run: pip install -r requirements.txt pytest pytest-flask pytest-cov ruff pip-audit

      - name: Lint (ruff)
        working-directory: api
        # Baseline rule set only (see api/ruff.toml) — E4/E7/E9/F. A real run still
        # surfaces ~122 pre-existing findings across the codebase (mostly unused
        # imports and E402 module-import-not-at-top), which is out of scope to fix
        # in an infra-focused pass. continue-on-error so this doesn't block the
        # pipeline yet; tighten/fix incrementally and remove this once clean.
        run: ruff check .
        continue-on-error: true

      - name: Dependency vulnerability scan (pip-audit)
        # A real run currently finds 49 known vulnerabilities in api/requirements.txt
        # (flask, flask-cors, marshmallow, python-dotenv, requests, pillow, pyasn1)
        # plus more in agent/ and dashboard/ requirements — upgrading those is a
        # separate compatibility-testing effort, not a quick fix here.
        # continue-on-error so this doesn't block the pipeline yet; it's still
        # useful as a visible, tracked signal going forward.
        run: |
          pip-audit -r api/requirements.txt
          pip-audit -r agent/requirements.txt
          pip-audit -r dashboard/requirements.txt
        continue-on-error: true

      - name: Run database migrations
        working-directory: api
        run: flask --app app:create_app db upgrade
        env:
          FLASK_ENV: development

      - name: Run tests with coverage
        working-directory: api
        run: |
          pytest tests/ -v \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml \
            --tb=short

      - name: Upload coverage report
        uses: codecov/codecov-action@v7
        if: always()
        with:
          files: api/coverage.xml
          fail_ci_if_error: false

  # Frontend: TypeScript build
  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Dependency vulnerability scan (npm audit)
        working-directory: frontend
        # A real run currently finds 6 pre-existing vulnerabilities (4 high: browserslist,
        # nanoid, react-router/react-router-dom; 2 moderate) in transitive deps.
        # Upgrading react-router in particular is a real compat-testing task, not a
        # quick fix here. continue-on-error so this doesn't block the pipeline yet.
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: /api

  # Docker: nginx multi-stage build (main branch only)
  build-docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7

      - name: Build nginx image
        run: |
          docker build \
            --file nginx/Dockerfile \
            --build-arg VITE_API_URL=/api \
            --tag rmm-nginx:ci \
            .
