[api]
# For agents on OTHER machines: replace localhost with the server's LAN/WiFi IP
# e.g. url = http://192.168.1.100:5000
# Run setup_agent.py to set this automatically.
url = http://localhost:5000
org_token = ***REMOVED-ORG-TOKEN***

[agent]
device_id = ***REMOVED-DEVICE-ID***
agent_token = ***REMOVED-AGENT-TOKEN***
heartbeat_interval = 60
software_interval = 21600
version = 1.0.0

[logging]
level = INFO
file = rmm_agent.log

